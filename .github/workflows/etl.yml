# Velocidade: ingestão em lote agendada (batch) — roda todo dia 5 de cada mês e
# reprocessa apenas os anos cuja base mudou no Portal de Dados Abertos do SUS.
name: ETL agendado (SIM + SINASC -> Aiven)

on:
  schedule:
    - cron: "0 6 5 * *"          # 03:00 (BRT) do dia 5 de cada mês
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a processar (ex.: 2023 | 2019-2024)"
        default: "2019-2024"
      incremental:
        description: "Pular anos sem alteração na fonte"
        type: boolean
        default: true

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes das regras de negócio
        run: pytest etl/tests -q

      - name: Cache dos microdados baixados
        uses: actions/cache@v4
        with:
          path: data/raw
          key: microdados-${{ github.run_id }}
          restore-keys: microdados-

      # Diagnóstico: os runners do GitHub ficam fora do Brasil e alguns servidores do governo
      # recusam essas conexões. O resultado vira anotação no resumo da execução.
      - name: Testar acesso às fontes
        continue-on-error: true
        run: |
          for url in \
            "https://dadosabertos.saude.gov.br/api/ckan/api/3/action/site_read" \
            "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SIM/csv/Mortalidade_Geral_2024_csv.zip" \
            "https://servicodados.ibge.gov.br/api/v1/localidades/regioes" \
            "http://www2.datasus.gov.br/cid10/V2008/cid10.htm"; do
            code=$(curl -s -o /dev/null -I -m 15 -w "%{http_code}" "$url" || true)
            echo "::notice title=Acesso a fonte::${url%%\?*} -> HTTP ${code:-000}"
          done

      - name: Executar pipeline
        env:
          # Segredos configurados em Settings > Secrets and variables > Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DB_USER: ${{ secrets.DASHBOARD_DB_USER }}
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          ANOS="${{ github.event.inputs.anos || '2019-2024' }}"
          FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.incremental }}" = "true" ]; then
            FLAG="--incremental"
          fi
          set -o pipefail
          if ! python -m etl.pipeline --anos "$ANOS" $FLAG 2>&1 | tee etl.log; then
            # Publica o fim do log como anotação (visível no resumo da execução)
            echo "::error title=ETL falhou::$(grep -E 'ERROR|Error|Exception|Falha' etl.log | tail -5 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=ETL concluído::$(grep -E 'pulando|carregado|Concluído|Tamanho total' etl.log | tr '\n' ' ' | cut -c1-900)"
